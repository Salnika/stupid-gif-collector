<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="metal-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.2"/>
    </linearGradient>

    <pattern id="hairline" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="1" height="4" fill="#ffffff" fill-opacity="0.16"/>
      <rect x="1" width="2" height="4" fill="#ffffff" fill-opacity="0.02"/>
      <rect x="3" width="1" height="4" fill="#000000" fill-opacity="0.08"/>
    </pattern>

    <filter id="metal-noise" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.6" numOctaves="2" seed="23" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.11"/>
      </feComponentTransfer>
    </filter>
  </defs>

  <rect width="256" height="256" fill="url(#metal-grad)"/>
  <rect width="256" height="256" fill="url(#hairline)"/>
  <rect width="256" height="256" filter="url(#metal-noise)"/>
</svg>
