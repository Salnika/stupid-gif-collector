<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <filter id="cloud-c" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.032" numOctaves="3" seed="41" stitchTiles="stitch" result="noise"/>
      <feColorMatrix in="noise" type="matrix" values="0.70 0 0 0 0.20  0 0.62 0 0 0.17  0 0 0.50 0 0.13  0 0 0 0.72 0" />
    </filter>
    <filter id="grain-c" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.95" numOctaves="2" seed="13" stitchTiles="stitch" />
      <feColorMatrix type="saturate" values="0" />
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.15" />
      </feComponentTransfer>
    </filter>
  </defs>

  <rect width="256" height="256" filter="url(#cloud-c)" opacity="0.95"/>
  <rect width="256" height="256" filter="url(#grain-c)" opacity="0.8"/>
</svg>
