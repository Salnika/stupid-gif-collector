<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <filter id="cloud-uc" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="3" seed="47" stitchTiles="stitch" result="noise"/>
      <feColorMatrix in="noise" type="matrix" values="0.58 0 0 0 0.17  0 0.68 0 0 0.23  0 0 0.82 0 0.33  0 0 0 0.68 0" />
    </filter>
    <filter id="grain-uc" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="1.0" numOctaves="2" seed="23" stitchTiles="stitch" />
      <feColorMatrix type="saturate" values="0" />
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.14" />
      </feComponentTransfer>
    </filter>
  </defs>

  <rect width="256" height="256" filter="url(#cloud-uc)" opacity="0.94"/>
  <rect width="256" height="256" filter="url(#grain-uc)" opacity="0.78"/>
</svg>
